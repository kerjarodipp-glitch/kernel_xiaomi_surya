name: StormBreaker Kernel Build

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          flex \
          cpio \
          curl \
          git \
          wget \
          zip \
          unzip \
          xxd \
          python3 \
          python3-pip \
          python2 \
          device-tree-compiler \
          libssl-dev \
          libelf-dev \
          clang \
          llvm \
          lld \
          openjdk-11-jre

    - name: Setup git
      run: |
        git config --global user.name "Forenche"
        git config --global user.email "prahul2003@gmail.com"
        git config --global color.ui false

    - name: Install Python2 fallback
      run: |
        sudo ln -sf /usr/bin/python2 /usr/bin/python || true

    - name: Build Kernel
      env:
        TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      run: |
        chmod +x kramel.sh
        bash kramel.sh

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: StormBreaker-Kernel
        path: |
          AnyKernel3/*.zip
